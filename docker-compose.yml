services:
  db:
    image: postgres:16-alpine
    container_name: promotion-service-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: promotions
      POSTGRES_PASSWORD: promotions
      POSTGRES_DB: promotions
    ports:
      - "5432:5432"
    volumes:
      - promotion-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promotions -d promotions"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  promotion-db-data:
